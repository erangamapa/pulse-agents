[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulse-scoring"
version = "0.1.0"
description = "Win probability scoring sidecar for pulse-agents"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eranga Mapa" }]
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "joblib>=1.4",
  "pydantic>=2.7",
  "sportsbook-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["scoring"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
